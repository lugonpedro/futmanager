<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1d7a41" />
    <meta name="description" content="Gerencie seu time rumo à primeira divisão." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>onzemestre</title>
    <script>
      // Applies the saved theme before the first paint, so dark mode doesn't flash white.
      // Dark unless light was chosen.
      let dark = true
      try {
        dark = JSON.parse(localStorage.getItem('futmanager-tema'))?.state?.theme !== 'claro'
      } catch {}
      if (dark) document.documentElement.classList.add('dark')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
