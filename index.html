<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>futmanager</title>
    <script>
      // Applies the saved theme before the first paint, so dark mode doesn't flash white.
      try {
        const theme = JSON.parse(localStorage.getItem('futmanager-tema'))?.state?.theme
        const dark =
          theme === 'escuro' ||
          (theme !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
